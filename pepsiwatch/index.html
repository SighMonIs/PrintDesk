<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PepsiWatch</title>
<style>
  :root { --bg: #fff; --fg: #111; --muted: #666; --line: #ddd; --hi: #dff5e1; --pepsi: #004b93; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #eee; --muted: #999; --line: #333; --hi: #1f4d2a; --pepsi: #4a90e2; } }
  body { margin: 0 auto; max-width: 900px; padding: 16px; font: 16px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  h1 { color: var(--pepsi); margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { font-size: 13px; color: var(--muted); text-transform: uppercase; cursor: pointer; user-select: none; }
  th.asc::after { content: " ▲"; } th.desc::after { content: " ▼"; }
  td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr.best { background: var(--hi); font-weight: 600; }
  a { color: inherit; }
  .err { color: #c00; }
  @media (max-width: 600px) {
    body { font-size: 14px; padding: 12px; }
    th, td { padding: 6px 4px; }
    th:nth-child(4), td:nth-child(4) { display: none; } /* litres: already in the product name */
    .filters { gap: 8px; }
  }
  .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
  .filters label { display: flex; gap: 4px; align-items: center; }
  .filters select { padding: 6px 4px; font: inherit; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); }
  .filters input[type=search] { padding: 6px 8px; font: inherit; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); flex: 1; min-width: 160px; }
</style>
</head>
<body>
<h1>PepsiWatch</h1>
<div class="meta" id="meta">Loading…</div>
<div class="filters" id="filters">
  <label><input type="checkbox" value="Coles" checked> Coles</label>
  <label><input type="checkbox" value="Woolworths" checked> Woolworths</label>
  <label><input type="checkbox" value="Amazon" checked> Amazon</label>
  <select id="type"><option value="">All types</option></select>
  <select id="size"><option value="">All sizes</option></select>
  <select id="flavour"><option value="">All flavours</option></select>
  <input type="search" id="q" placeholder="Filter products, e.g. cans, 1.25L, vanilla">
</div>
<table>
  <thead><tr><th data-key="store">Store</th><th data-key="name">Product</th><th class="num" data-key="price">Price</th><th class="num" data-key="litres">Litres</th><th class="num" data-key="per_litre">$/L</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
const $ = id => document.getElementById(id);
let rows = [], sort = { key: 'per_litre', dir: 1 };
// Derive type / unit size / flavour from the product name — the stores don't give them as fields.
function tag(r) {
  const n = r.name.toLowerCase();
  const m = n.match(/(\d+(?:\.\d+)?)\s*(ml|l|litre)\b/);
  const ml = m ? +m[1] * (m[2] === 'ml' ? 1 : 1000) : 0;
  r.type = /\bcans?\b/.test(n) ? 'Can' : 'Bottle';
  r.size = ml >= 1000 ? ml / 1000 + 'L' : ml + 'mL';
  // Every row is Pepsi Max no-sugar cola, so those words are noise on a narrow screen.
  r.short = r.name.replace(/pepsi max|soft drink|no sugar|zero sugar|cola|multipack|,/gi, '').replace(/\s+/g, ' ').trim();
  r.flavour = (n.match(/vanilla|raspberry|creaming soda|mango|lime|caffeine free/) || ['Original'])[0].replace(/\b\w/g, c => c.toUpperCase());
}
function fill(id, key) {
  const vals = [...new Set(rows.map(r => r[key]))].sort((a, b) => key === 'size' ? parseFloat(a) * (a.endsWith('mL') ? 1 : 1000) - parseFloat(b) * (b.endsWith('mL') ? 1 : 1000) : a.localeCompare(b));
  $(id).innerHTML += vals.map(v => `<option>${v}</option>`).join('');
}
function render() {
  const stores = [...document.querySelectorAll('#filters input:checked')].map(c => c.value);
  const terms = $('q').value.toLowerCase().split(/\s+/).filter(Boolean);
  const shown = rows.filter(r => stores.includes(r.store) && terms.every(t => r.name.toLowerCase().includes(t))
    && ['type', 'size', 'flavour'].every(k => !$(k).value || r[k] === $(k).value));
  shown.sort((a, b) => (typeof a[sort.key] === 'number' ? a[sort.key] - b[sort.key] : a[sort.key].localeCompare(b[sort.key])) * sort.dir || a.per_litre - b.per_litre);
  document.querySelectorAll('th').forEach(th => th.className = th.className.replace(/ ?(asc|desc)/, '') + (th.dataset.key === sort.key ? (sort.dir > 0 ? ' asc' : ' desc') : ''));
  const best = Math.min(...shown.map(r => r.per_litre));
  $('rows').innerHTML = shown.map(r => `
    <tr class="${r.per_litre === best ? 'best' : ''}">
      <td>${r.store}</td>
      <td><a href="${r.url}" target="_blank" rel="noopener">${r.short}</a></td>
      <td class="num">$${r.price.toFixed(2)}</td>
      <td class="num">${r.litres}</td>
      <td class="num">$${r.per_litre.toFixed(2)}</td>
    </tr>`).join('') || '<tr><td colspan="5">Nothing matches</td></tr>';
}
$('filters').addEventListener('input', render);
document.querySelector('thead').addEventListener('click', e => {
  const key = e.target.dataset.key;
  if (!key) return;
  sort = { key, dir: sort.key === key ? -sort.dir : 1 };
  render();
});
fetch('prices.json?' + Date.now()).then(r => r.json()).then(d => {
  rows = d.rows;
  rows.forEach(tag);
  fill('type', 'type'); fill('size', 'size'); fill('flavour', 'flavour');
  render();
  const errs = Object.keys(d.errors);
  const tick = () => {
    const left = Math.round((new Date(d.next) - Date.now()) / 1000);
    const next = left > 0 ? `next scrape in ${Math.floor(left / 3600)}h ${Math.floor(left % 3600 / 60)}m ${left % 60}s` : 'next scrape overdue';
    $('meta').innerHTML =
      `Updated ${new Date(d.updated).toLocaleString('en-AU')} · ${next} · cheapest per litre highlighted` +
      (errs.length ? ` · <span class="err">${errs.join(', ')} unreachable, showing last known prices</span>` : '');
  };
  tick(); setInterval(tick, 1000);
}).catch(e => document.getElementById('meta').textContent = 'Failed to load prices: ' + e);
</script>
</body>
</html>
