<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- No maximum-scale: pinch-zoom stays available. viewport-fit covers the notch. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<title>OrderDesk — PrintDesk v2</title>
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/fonts/tabler-icons.woff2?v3.46.0" as="font" type="font/woff2" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" integrity="sha384-ND+q1IVc0KDElX60dZaqKc7Xl9cdxd2PpU2JfVUHcurCkFVtVLFdt9vJfxtHSL3p" crossorigin="anonymous">
<link rel="stylesheet" href="app.css?v=2.3.0">
<script src="../config.js"></script>
<script>window.CONFIG = window.CONFIG || { SUPABASE_URL: '', SUPABASE_KEY: '' };</script>
</head>
<body>

<!-- Shown until the stored session has been checked, so the sign-in card
     never flashes up for someone who is already signed in. -->
<div id="bootSplash" class="boot-splash"><i class="ti ti-loader-2 spin"></i></div>

<!-- ══ Sign in (ids are the ones shared/sb.js drives) ══ -->
<div id="loginScreen" class="login-screen" style="display:none">
  <div class="login-card">
    <div class="login-logo">OrderDesk</div>
    <div class="login-subtitle">PrintDesk v2 &middot; sign in to continue</div>
    <div id="loginError" class="login-error" style="display:none"></div>
    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="username email" inputmode="email" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn primary login-submit-btn" id="loginBtn" onclick="doLogin()">
      <i class="ti ti-login"></i> Sign in
    </button>
  </div>
</div>

<!-- ══ App ══ -->
<div class="shell" id="appScreen" style="display:none">

  <nav class="rail">
    <div class="rail-brand">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="7" width="18" height="13" rx="2"></rect>
        <path d="M3 11h18"></path><path d="M8 7V4h8v3"></path>
      </svg>
      <span>OrderDesk</span>
    </div>
    <div class="rail-nav" id="railNav"></div>
    <div class="rail-end">
      <button class="rail-item" id="railSettings" onclick="go('settings')"><i class="ti ti-settings"></i><span>Settings</span></button>
      <div class="rail-user" title="Signed in">
        <div class="avatar av-user" id="userChip">&nbsp;</div>
        <span id="userName"></span>
      </div>
      <button class="rail-item" onclick="doLogout()"><i class="ti ti-logout"></i><span>Sign out</span></button>
      <div class="rail-ver" id="railVer">v2.0.0</div>
    </div>
  </nav>

  <main class="main">
    <header class="topbar">
      <button class="btn icon ghost only-mobile hide" id="backBtn" onclick="closeDetail()" aria-label="Back"><i class="ti ti-arrow-left"></i></button>
      <div class="searchbox">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input id="globalSearch" type="search" placeholder="Search&hellip;" aria-label="Search" oninput="render()">
      </div>
      <button class="btn primary" onclick="openNewOrder()" title="New order"><i class="ti ti-plus"></i><span class="not-mobile">New order</span></button>
      <button class="btn icon ghost only-mobile" onclick="go('settings')" aria-label="Settings"><i class="ti ti-settings"></i></button>
      <div class="avatar av-user only-mobile" id="userChipMobile">&nbsp;</div>
      <button class="btn icon ghost only-mobile" onclick="doLogout()" aria-label="Sign out"><i class="ti ti-logout"></i></button>
    </header>
    <div class="body" id="viewRoot">
      <div class="empty"><i class="ti ti-loader-2 spin"></i><p>Loading&hellip;</p></div>
    </div>
  </main>

</div>

<div class="toast" id="toast" style="display:none"></div>

<script src="../shared/sb.js?v=2.3.0"></script>
<script src="app.js?v=2.3.0"></script>
</body>
</html>
