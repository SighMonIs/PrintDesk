name: PrintDesk Urgent Item Alert

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check item threshold and alert
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Row level security closed the REST API to the public anon key, so
          # this reads the database directly with the same secret db-backup
          # already uses. No anon key in CI, and nothing here is reachable
          # from the internet.
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" --no-align --tuples-only --variable ON_ERROR_STOP=1 \
            --command "
              select json_build_object(
                'cfg', coalesce((select json_object_agg(key, value)
                                   from app_settings where key like 'notify_%'), '{}'::json),
                'orders', coalesce((select json_agg(json_build_object(
                                      'order_id', order_id, 'customer', customer, 'qty', qty))
                                      from orders
                                     where created_at >= now() - interval '20 minutes'
                                       and coalesce(deleted, false) = false), '[]'::json))
            " > payload.json

          python3 << 'PYEOF'
          import json, os, subprocess, urllib.request, urllib.error
          from datetime import datetime, timezone

          RESEND = os.environ.get('RESEND_API_KEY', '')
          data   = json.load(open('payload.json'))
          cfg    = data['cfg'] or {}
          orders = data['orders'] or []

          if cfg.get('notify_threshold_enabled') != 'true':
              print('Threshold alerts disabled — skipping'); exit(0)
          email = cfg.get('notify_email', '')
          if not email:
              print('No notification email set — skipping'); exit(0)

          threshold = int(cfg.get('notify_threshold_count') or 5)

          # Don't spam — only send once per hour
          last_sent_str = cfg.get('notify_threshold_last_sent', '')
          if last_sent_str:
              last_sent = datetime.fromisoformat(last_sent_str.replace('Z', '+00:00'))
              if (datetime.now(timezone.utc) - last_sent).total_seconds() < 3600:
                  print('Sent less than 1 hour ago — skipping'); exit(0)

          total_qty = sum(int(o.get('qty') or 1) for o in orders)
          if total_qty < threshold:
              print(f'{total_qty} items in last 20 min — below threshold of {threshold}'); exit(0)

          # Deduplicate order summaries
          seen, unique = set(), []
          for o in orders:
              oid = o.get('order_id', '')
              if oid not in seen:
                  seen.add(oid); unique.append(o)

          lines = '\n'.join(
              f"  • Order #{o.get('order_id','-')} — {o.get('customer','Unknown')} "
              f"({o.get('qty',1)} item{'s' if int(o.get('qty',1)) != 1 else ''})"
              for o in unique
          )
          body = (
              f"PrintDesk — Busy Period Alert 🚨\n\n"
              f"{total_qty} items across {len(unique)} order{'s' if len(unique) != 1 else ''} "
              f"added in the last 20 minutes (threshold: {threshold}):\n\n"
              f"{lines}\n\n"
              f"View all orders: https://simonreid.space\n"
          )

          # This repo is public and so is this log — the names go in the email,
          # not here.
          print(f'{total_qty} items across {len(unique)} orders — sending alert')

          if not RESEND:
              print('No RESEND_API_KEY secret — email not sent'); exit(0)

          payload = json.dumps({
              'from': 'PrintDesk <onboarding@resend.dev>',
              'to':   [email],
              'subject': f'PrintDesk: {total_qty} items just came in!',
              'text': body
          }).encode()
          req = urllib.request.Request(
              'https://api.resend.com/emails', data=payload,
              headers={'Authorization': f'Bearer {RESEND}', 'Content-Type': 'application/json'}
          )
          try:
              with urllib.request.urlopen(req) as r:
                  r.read()
                  print('Alert sent')
          except urllib.error.HTTPError as e:
              print('Resend error:', e.read().decode()); exit(1)

          # Record send time to prevent spam
          subprocess.run(
              ['psql', os.environ['DB_URL'], '--variable', 'ON_ERROR_STOP=1', '--command',
               "insert into app_settings (key, value) "
               "values ('notify_threshold_last_sent', to_char(now() at time zone 'utc', "
               "'YYYY-MM-DD\"T\"HH24:MI:SS\"Z\"')) "
               "on conflict (key) do update set value = excluded.value"],
              check=True)
          PYEOF
