name: PepsiWatch prices

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py
        working-directory: pepsiwatch
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pepsiwatch/prices.json
          git diff --cached --quiet || git commit -m "pepsiwatch: update prices" && git push
