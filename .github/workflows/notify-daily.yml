name: PrintDesk Daily Badge Digest

on:
  schedule:
    - cron: '0 6 * * *'  # 4PM AEST (UTC+10) / 5PM AEDT (UTC+11)
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily badge digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Reads the database directly rather than through the public REST
          # API — see notify-threshold.yml.
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Set a repository variable NOTIFY_FROM when the domain moves off resend.dev.
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM }}
        run: |
          psql "$DB_URL" --no-align --tuples-only --variable ON_ERROR_STOP=1 \
            --command "
              select json_build_object(
                'cfg', coalesce((select json_object_agg(key, value)
                                   from app_settings where key like 'notify_%'), '{}'::json),
                'orders', coalesce((select json_agg(json_build_object(
                                      'order_id', o.order_id, 'customer', o.customer, 'qty', o.qty))
                                      from orders o
                                      join categories c on c.id = o.cat_id
                                     where c.archived = false
                                       and lower(c.name) like '%badge%'
                                       and o.created_at >= now() - interval '24 hours'
                                       and coalesce(o.deleted, false) = false), '[]'::json))
            " > payload.json

          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error

          RESEND = os.environ.get('RESEND_API_KEY', '')
          data   = json.load(open('payload.json'))
          cfg    = data['cfg'] or {}
          orders = data['orders'] or []

          if cfg.get('notify_daily_enabled') != 'true':
              print('Daily digest disabled — skipping'); exit(0)
          email = cfg.get('notify_email', '')
          if not email:
              print('No notification email set — skipping'); exit(0)

          # Deduplicate by order_id and count total items
          seen, unique, total_qty = set(), [], 0
          for o in orders:
              total_qty += int(o.get('qty') or 1)
              oid = o.get('order_id', '')
              if oid not in seen:
                  seen.add(oid); unique.append(o)

          if not unique:
              print('No new badge orders today — no email sent'); exit(0)

          n     = len(unique)
          lines = '\n'.join(
              f"  • Order #{o.get('order_id','-')} — {o.get('customer','Unknown')} "
              f"({o.get('qty',1)} item{'s' if int(o.get('qty',1)) != 1 else ''})"
              for o in unique
          )
          body = (
              f"PrintDesk — Daily Badge Summary\n\n"
              f"{n} badge order{'s' if n != 1 else ''}, {total_qty} item{'s' if total_qty != 1 else ''} in the last 24 hours:\n\n"
              f"{lines}\n\n"
              f"View all orders: https://simonreid.space\n"
          )

          # This repo is public and so is this log — the names go in the email,
          # not here.
          print(f'{n} badge orders, {total_qty} items — sending digest')

          if not RESEND:
              print('No RESEND_API_KEY secret — email not sent'); exit(0)

          payload = json.dumps({
              'from': os.environ.get('NOTIFY_FROM') or 'PrintDesk <onboarding@resend.dev>',
              'to':   [email],
              'subject': f'PrintDesk: {n} new badge order{"s" if n != 1 else ""} today ({total_qty} items)',
              'text': body
          }).encode()
          req = urllib.request.Request(
              'https://api.resend.com/emails', data=payload,
              headers={'Authorization': f'Bearer {RESEND}', 'Content-Type': 'application/json',
                       # Cloudflare fronts api.resend.com and rejects the default
                       # Python-urllib agent with a 1010 browser-integrity error.
                       'User-Agent': 'PrintDesk/1.0'}
          )
          try:
              with urllib.request.urlopen(req) as r:
                  r.read()
                  print('Email sent')
          except urllib.error.HTTPError as e:
              print('Resend error:', e.read().decode()); exit(1)
          PYEOF
